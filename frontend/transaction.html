<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Transactions — Fintrack</title>

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
</head>

<body>

    <!-- ===== SIDEBAR (COPIED FROM YOUR DASHBOARD) ===== -->
    <aside class="sidebar">

        <div class="sidebar-brand">
            <div class="sidebar-logo">F</div>
            <div>
                <div class="sidebar-brand-name">Fintrack</div>
                <div class="sidebar-brand-sub">Finance Dashboard</div>
            </div>
        </div>

        <nav>
            <div class="sidebar-section-label">Main</div>

            <div class="sidebar-nav">
                <div class="sidebar-item" onclick="goTo('index.html')">
                    <i class="fas fa-house"></i> Overview
                </div>

                <div class="sidebar-item active" onclick="goTo('transaction.html')">
                    <i class="fas fa-arrow-right-arrow-left"></i> Transactions
                </div>

                <div class="sidebar-item" onclick="goTo('analytics.html')">
                    <i class="fas fa-chart-pie"></i> Analytics
                </div>

               <div class="sidebar-item" onclick="goTo('budget.html')">
                    <i class="fas fa-wallet"></i> Budgets
                </div>
            </div>

            <hr class="sidebar-divider" />

        </nav>

    </aside>

    <!-- ===== MAIN CONTENT ===== -->
    <div class="main-content">

        <div class="card">
            <div class="card-header">
                <span class="card-title">All Transactions</span>
            </div>

            <!-- FILTER + SORT BAR -->
            <div class="tx-controls">

                <select id="filterType" onchange="applyTxFilters()">
                    <option value="all">All Types</option>
                    <option value="income">Income</option>
                    <option value="expense">Expense</option>
                </select>

                <select id="filterCategory" onchange="applyTxFilters()">
                    <option value="all">All Categories</option>

                    <optgroup label="Income">
                        <option value="Salary">Salary</option>
                        <option value="Freelance">Freelance</option>
                        <option value="Investment">Investment</option>
                    </optgroup>

                    <optgroup label="Expense">
                        <option value="food">Food</option>
                        <option value="entertainment">Entertainment</option>
                        <option value="shopping">Shopping</option>
                        <option value="investment">Investment</option>
                    </optgroup>
                </select>

                <select id="sortBy" onchange="applyTxFilters()">
                    <option value="latest">Latest First</option>
                    <option value="oldest">Oldest First</option>
                    <option value="high">Highest Amount</option>
                    <option value="low">Lowest Amount</option>
                </select>

            </div>

            <table class="transactions-table">
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Category</th>
                        <th>Type</th>
                        <th>Amount</th>
                        <th>Action</th>
                    </tr>
                </thead>

                <tbody id="allTransactionsBody">
                    <!-- JS loads data here -->
                </tbody>
            </table>
        </div>

    </div>

    <!-- EDIT MODAL -->
    <div id="editModal" class="modal">
        <div class="modal-content">

            <div class="modal-header">
                <h2 class="modal-title">Edit Transaction</h2>
            </div>

            <div class="modal-body">
                <input type="number" id="editAmount" class="form-input" placeholder="Amount">

                <select id="editCategory" class="form-select">
                    <option value="food">Food</option>
                    <option value="entertainment">Entertainment</option>
                    <option value="shopping">Shopping</option>
                    <option value="investment">Investment</option>
                </select>

                <select id="editType" class="form-select">
                    <option value="income">Income</option>
                    <option value="expense">Expense</option>
                </select>

                <input type="date" id="editDate" class="form-input">
            </div>

            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeModal('editModal')">Cancel</button>
                <button class="btn btn-primary" onclick="saveEdit()">Save</button>
            </div>

        </div>
    </div>

    <!-- SCRIPT -->
    <script src="script.js"></script>

</body>

</html>
